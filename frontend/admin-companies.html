<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Company Management | Student2Career</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {
            background: #FFF7ED;
            color: #242124;
        }

        .page {
            max-width: 1250px;
            margin: auto;
            padding: 35px 25px 60px;
        }

        /* =========================
           HEADER
        ========================= */

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: #7A1F3D;
            font-size: 32px;
        }

        .subtitle {
            color: #756F72;
            margin-top: 7px;
        }

        .back {
            text-decoration: none;
            background: #7A1F3D;
            color: white;
            padding: 11px 18px;
            border-radius: 9px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* =========================
           STAT CARDS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border: 1px solid #E8E0DC;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 5px 18px rgba(80, 40, 30, 0.06);
        }

        .stat span {
            display: block;
            color: #756F72;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat strong {
            font-size: 28px;
            color: #7A1F3D;
        }

        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {
            background: white;
            border: 1px solid #E8E0DC;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;

            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search {
            flex: 1;
            padding: 13px 15px;
            border: 1px solid #D9CFCA;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .search:focus {
            border-color: #7A1F3D;
        }

        .add,
        .refresh {
            border: none;
            color: white;
            padding: 13px 20px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .add {
            background: #7A1F3D;
        }

        .refresh {
            background: #E76F51;
        }

        .add:hover,
        .refresh:hover {
            opacity: 0.9;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
        }

        .success {
            background: #E5F1E8;
            color: #356143;
        }

        .error {
            background: #F9E0DC;
            color: #9E3024;
        }

        /* =========================
           TABLE
        ========================= */

        .table-box {
            background: white;
            border: 1px solid #E8E0DC;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(80, 40, 30, 0.06);
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
        }

        th {
            background: #7A1F3D;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #EEE7E3;
            font-size: 14px;
        }

        tr:hover td {
            background: #FFF9F5;
        }

        .company-name {
            font-weight: 700;
            color: #7A1F3D;
        }

        .internship-count {
            font-weight: 700;
            color: #5F8068;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .action {
            border: none;
            padding: 8px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .view {
            background: #F1E5E8;
            color: #7A1F3D;
        }

        .edit {
            background: #FBE5DC;
            color: #A4482F;
        }

        .delete {
            background: #F8DAD5;
            color: #9E3024;
        }

        .action:hover {
            opacity: 0.85;
        }

        .empty {
            text-align: center;
            padding: 45px;
            color: #756F72;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;

            background: rgba(36, 33, 36, 0.55);

            z-index: 9999;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 600px;
            max-height: 90vh;

            overflow-y: auto;

            background: white;

            border-radius: 18px;

            padding: 28px;

            position: relative;

            box-sizing: border-box;
        }

        .modal-box h2 {
            color: #7A1F3D;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .close {
            position: absolute;

            right: 18px;
            top: 12px;

            border: none;
            background: transparent;

            font-size: 25px;
            cursor: pointer;

            color: #756F72;
        }

        .close:hover {
            color: #7A1F3D;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;

            margin-bottom: 6px;

            font-weight: 600;

            color: #5B1730;
        }

        .form-group input {
            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #D9CFCA;

            border-radius: 8px;

            font-size: 14px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #7A1F3D;
        }

        .save {
            width: 100%;

            border: none;

            background: #7A1F3D;

            color: white;

            padding: 13px;

            border-radius: 9px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;
        }

        .save:hover {
            opacity: 0.9;
        }

        /* =========================
           DETAILS
        ========================= */

        .details {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .detail {
            background: #FFF7ED;

            padding: 15px;

            border-radius: 10px;

            border: 1px solid #F0E4DE;
        }

        .detail small {
            display: block;

            color: #756F72;

            margin-bottom: 5px;

            font-size: 12px;
        }

        .detail strong {
            color: #242124;

            word-break: break-word;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .page {
                padding: 25px 15px 50px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .add,
            .refresh {
                width: 100%;
            }

            .details {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="top">

        <div>

            <h1>
                Company Management
            </h1>

            <div class="subtitle">
                Manage companies registered in Student2Career.
            </div>

        </div>


        <a
            href="admin-dashboard.html"
            class="back"
        >
            ← Admin Dashboard
        </a>

    </div>


    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="stats">


        <div class="stat">

            <span>
                Total Companies
            </span>

            <strong id="total">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Total Internships
            </span>

            <strong id="internships">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Companies with Internships
            </span>

            <strong id="activeCompanies">
                0
            </strong>

        </div>


    </div>


    <!-- =========================
         TOOLBAR
    ========================= -->

    <div class="toolbar">

        <input
            type="text"
            id="search"
            class="search"
            placeholder="Search company, location, registration number or contact..."
        >


        <button
            type="button"
            class="add"
            onclick="openAdd()"
        >
            + Add Company
        </button>


        <button
            type="button"
            class="refresh"
            onclick="loadCompanies()"
        >
            ↻ Refresh
        </button>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- =========================
         COMPANY TABLE
    ========================= -->

    <div class="table-box">

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Company
                        </th>

                        <th>
                            Registration No.
                        </th>

                        <th>
                            Location
                        </th>

                        <th>
                            Contact Person
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Internships
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="companyTable">

                    <tr>

                        <td
                            colspan="8"
                            class="empty"
                        >
                            Loading companies...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>


<!-- =====================================================
     VIEW COMPANY MODAL
===================================================== -->

<div
    class="modal"
    id="viewModal"
>

    <div class="modal-box">


        <button
            type="button"
            class="close"
            onclick="closeModal('viewModal')"
        >
            ×
        </button>


        <h2>
            Company Details
        </h2>


        <div id="details"></div>


    </div>

</div>


<!-- =====================================================
     ADD / EDIT COMPANY MODAL
===================================================== -->

<div
    class="modal"
    id="formModal"
>

    <div class="modal-box">


        <button
            type="button"
            class="close"
            onclick="closeModal('formModal')"
        >
            ×
        </button>


        <h2 id="formTitle">
            Add Company
        </h2>


        <div
            id="formMessage"
            class="message"
        ></div>


        <form id="companyForm">


            <input
                type="hidden"
                id="companyId"
            >


            <div class="form-group">

                <label for="name">
                    Company Name *
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter company name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registration">
                    Registration Number *
                </label>

                <input
                    type="text"
                    id="registration"
                    placeholder="Enter unique registration number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="e.g. Pune"
                >

            </div>


            <div class="form-group">

                <label for="contactPerson">
                    Contact Person
                </label>

                <input
                    type="text"
                    id="contactPerson"
                    placeholder="e.g. HR Manager"
                >

            </div>


            <div class="form-group">

                <label for="contactEmail">
                    Contact Email
                </label>

                <input
                    type="email"
                    id="contactEmail"
                    placeholder="e.g. hr@company.com"
                >

            </div>


            <button
                type="submit"
                class="save"
            >
                Save Company
            </button>


        </form>


    </div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API =
    "http://localhost:5000/api";


let companies = [];


/* =====================================================
   LOAD COMPANIES
===================================================== */

async function loadCompanies() {

    const table =
        document.getElementById("companyTable");


    table.innerHTML = `
        <tr>
            <td
                colspan="8"
                class="empty"
            >
                Loading companies...
            </td>
        </tr>
    `;


    try {

        const response =
            await fetch(
                `${API}/companies`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load companies."
            );

        }


        companies =
            Array.isArray(data.companies)
                ? data.companies
                : [];


        updateStats();

        displayCompanies(
            companies
        );


    } catch (error) {

        console.error(
            "Company loading error:",
            error
        );


        table.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="empty"
                >
                    Unable to load companies.
                    <br><br>
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

    }

}


/* =====================================================
   UPDATE STATISTICS
===================================================== */

function updateStats() {

    document.getElementById("total")
        .textContent =
        companies.length;


    const totalInternships =
        companies.reduce(
            function(sum, company) {

                return (
                    sum +
                    Number(
                        company.internship_count || 0
                    )
                );

            },
            0
        );


    document.getElementById("internships")
        .textContent =
        totalInternships;


    const activeCompanies =
        companies.filter(
            function(company) {

                return Number(
                    company.internship_count || 0
                ) > 0;

            }
        ).length;


    document.getElementById("activeCompanies")
        .textContent =
        activeCompanies;

}


/* =====================================================
   DISPLAY COMPANIES
===================================================== */

function displayCompanies(list) {

    const table =
        document.getElementById(
            "companyTable"
        );


    if (!list.length) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="empty"
                >
                    No companies found.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML =
        list.map(
            function(company) {

                return `

                    <tr>

                        <td>
                            #${company.company_id}
                        </td>


                        <td class="company-name">
                            ${escapeHtml(
                                company.name
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                company.registration_number
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                company.location ||
                                "Not provided"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                company.contact_person ||
                                "Not provided"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                company.contact_email ||
                                "Not provided"
                            )}
                        </td>


                        <td>

                            <span class="internship-count">
                                ${
                                    Number(
                                        company.internship_count || 0
                                    )
                                }
                            </span>

                        </td>


                        <td>

                            <div class="actions">


                                <button
                                    type="button"
                                    class="action view"
                                    onclick="viewCompany(
                                        ${company.company_id}
                                    )"
                                >
                                    View
                                </button>


                                <button
                                    type="button"
                                    class="action edit"
                                    onclick="editCompany(
                                        ${company.company_id}
                                    )"
                                >
                                    Edit
                                </button>


                                <button
                                    type="button"
                                    class="action delete"
                                    onclick="deleteCompany(
                                        ${company.company_id}
                                    )"
                                >
                                    Delete
                                </button>


                            </div>

                        </td>


                    </tr>

                `;

            }
        ).join("");

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function() {

            const value =
                this.value
                    .toLowerCase()
                    .trim();


            if (!value) {

                displayCompanies(
                    companies
                );

                return;

            }


            const filtered =
                companies.filter(
                    function(company) {

                        return (

                            String(
                                company.company_id
                            )
                            .toLowerCase()
                            .includes(value)


                            ||


                            (
                                company.name || ""
                            )
                            .toLowerCase()
                            .includes(value)


                            ||


                            (
                                company.registration_number || ""
                            )
                            .toLowerCase()
                            .includes(value)


                            ||


                            (
                                company.location || ""
                            )
                            .toLowerCase()
                            .includes(value)


                            ||


                            (
                                company.contact_person || ""
                            )
                            .toLowerCase()
                            .includes(value)


                            ||


                            (
                                company.contact_email || ""
                            )
                            .toLowerCase()
                            .includes(value)

                        );

                    }
                );


            displayCompanies(
                filtered
            );

        }
    );


/* =====================================================
   OPEN ADD COMPANY
===================================================== */

function openAdd() {

    document.getElementById(
        "formTitle"
    ).textContent =
        "Add Company";


    document.getElementById(
        "companyForm"
    ).reset();


    document.getElementById(
        "companyId"
    ).value =
        "";


    clearFormMessage();


    openModal(
        "formModal"
    );

}


/* =====================================================
   VIEW COMPANY
===================================================== */

async function viewCompany(id) {

    try {

        const response =
            await fetch(
                `${API}/companies/${id}`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load company."
            );

        }


        const company =
            data.company;


        document.getElementById(
            "details"
        ).innerHTML = `

            <div class="details">


                <div class="detail">

                    <small>
                        Company ID
                    </small>

                    <strong>
                        #${company.company_id}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        Company Name
                    </small>

                    <strong>
                        ${escapeHtml(
                            company.name
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        Registration Number
                    </small>

                    <strong>
                        ${escapeHtml(
                            company.registration_number
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        Location
                    </small>

                    <strong>
                        ${escapeHtml(
                            company.location ||
                            "Not provided"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        Contact Person
                    </small>

                    <strong>
                        ${escapeHtml(
                            company.contact_person ||
                            "Not provided"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        Contact Email
                    </small>

                    <strong>
                        ${escapeHtml(
                            company.contact_email ||
                            "Not provided"
                        )}
                    </strong>

                </div>


            </div>

        `;


        openModal(
            "viewModal"
        );


    } catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   EDIT COMPANY
===================================================== */

async function editCompany(id) {

    try {

        const response =
            await fetch(
                `${API}/companies/${id}`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load company."
            );

        }


        const company =
            data.company;


        document.getElementById(
            "formTitle"
        ).textContent =
            "Edit Company";


        document.getElementById(
            "companyId"
        ).value =
            company.company_id;


        document.getElementById(
            "name"
        ).value =
            company.name || "";


        document.getElementById(
            "registration"
        ).value =
            company.registration_number || "";


        document.getElementById(
            "location"
        ).value =
            company.location || "";


        document.getElementById(
            "contactPerson"
        ).value =
            company.contact_person || "";


        document.getElementById(
            "contactEmail"
        ).value =
            company.contact_email || "";


        clearFormMessage();


        openModal(
            "formModal"
        );


    } catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   SAVE COMPANY
===================================================== */

document
    .getElementById("companyForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const companyId =
                document.getElementById(
                    "companyId"
                ).value;


            const body = {

                name:
                    document.getElementById(
                        "name"
                    ).value.trim(),


                registration_number:
                    document.getElementById(
                        "registration"
                    ).value.trim(),


                location:
                    document.getElementById(
                        "location"
                    ).value.trim(),


                contact_person:
                    document.getElementById(
                        "contactPerson"
                    ).value.trim(),


                contact_email:
                    document.getElementById(
                        "contactEmail"
                    ).value.trim()

            };


            if (!body.name) {

                showFormMessage(
                    "Company name is required."
                );

                return;

            }


            if (!body.registration_number) {

                showFormMessage(
                    "Registration number is required."
                );

                return;

            }


            try {

                const url =
                    companyId
                        ? `${API}/companies/${companyId}`
                        : `${API}/companies`;


                const method =
                    companyId
                        ? "PATCH"
                        : "POST";


                const response =
                    await fetch(
                        url,
                        {
                            method: method,

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(body)
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to save company."
                    );

                }


                closeModal(
                    "formModal"
                );


                showMessage(
                    data.message ||
                    "Company saved successfully.",
                    "success"
                );


                await loadCompanies();


            } catch (error) {

                showFormMessage(
                    error.message
                );

            }

        }
    );


/* =====================================================
   DELETE COMPANY
===================================================== */

async function deleteCompany(id) {

    const company =
        companies.find(
            function(item) {

                return Number(
                    item.company_id
                ) === Number(id);

            }
        );


    if (!company) {
        return;
    }


    const internshipCount =
        Number(
            company.internship_count || 0
        );


    if (internshipCount > 0) {

        alert(
            "This company cannot be deleted because internships are linked to it."
        );

        return;

    }


    const confirmed =
        confirm(
            `Are you sure you want to delete "${company.name}"?`
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API}/companies/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to delete company."
            );

        }


        showMessage(
            data.message ||
            "Company deleted successfully.",
            "success"
        );


        await loadCompanies();


    } catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   MODAL
===================================================== */

function openModal(id) {

    document.getElementById(
        id
    ).style.display =
        "flex";

}


function closeModal(id) {

    document.getElementById(
        id
    ).style.display =
        "none";

}


/* Close modal by clicking outside */

window.addEventListener(
    "click",
    function(event) {

        if (
            event.target.classList
                .contains("modal")
        ) {

            event.target.style.display =
                "none";

        }

    }
);


/* Close modal with Escape */

window.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            document.querySelectorAll(
                ".modal"
            ).forEach(
                function(modal) {

                    modal.style.display =
                        "none";

                }
            );

        }

    }
);


/* =====================================================
   MAIN MESSAGE
===================================================== */

function showMessage(
    message,
    type
) {

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        message;


    box.className =
        "message " + type;


    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        3500
    );

}


/* =====================================================
   FORM MESSAGE
===================================================== */

function showFormMessage(message) {

    const box =
        document.getElementById(
            "formMessage"
        );


    box.textContent =
        message;


    box.className =
        "message error";


    box.style.display =
        "block";

}


function clearFormMessage() {

    const box =
        document.getElementById(
            "formMessage"
        );


    box.textContent =
        "";


    box.style.display =
        "none";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadCompanies();

</script>
