<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Faculty Interviews | Student2Career</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        .interview-page {
            min-height: 100vh;
            background: var(--warm-white);
        }

        .interview-header {
            padding: 28px 50px;
            border-bottom: 1px solid var(--border);
            background: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .interview-brand {
            font-size: 25px;
            font-weight: 700;
            color: var(--wine);
        }

        .back-link {
            color: var(--wine);
            font-weight: 600;
            text-decoration: none;
        }

        .interview-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 55px 25px;
        }

        .eyebrow {
            color: var(--wine);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: 48px;
            margin: 12px 0;
            color: var(--charcoal);
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 35px;
        }

        .message {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            display: block;
            background: #edf7ef;
            color: #35643c;
        }

        .error {
            display: block;
            background: #fff0f0;
            color: #9b3333;
        }

        .interview-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 22px;
            box-shadow: var(--shadow);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .student-name {
            font-size: 23px;
            font-weight: 700;
            color: var(--charcoal);
        }

        .internship-name {
            color: var(--wine);
            font-weight: 600;
            margin-top: 5px;
        }

        .company-name {
            color: var(--muted);
            margin-top: 4px;
        }

        .status {
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            background: #f7e6ec;
            color: var(--wine);
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .detail-box {
            background: var(--warm-white);
            padding: 15px;
            border-radius: 12px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: 600;
            color: var(--charcoal);
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .primary {
            background: var(--wine);
            color: white;
        }

        .secondary {
            background: #f2ece9;
            color: var(--charcoal);
        }

        .danger {
            background: #f9dddd;
            color: #9b3333;
        }

        .form-panel {
            display: none;
            margin-top: 22px;
            padding: 22px;
            background: #faf7f5;
            border-radius: 14px;
        }

        .form-panel.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--charcoal);
        }

        input,
        textarea {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .empty {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 55px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 750px) {

            .interview-header {
                padding: 22px;
            }

            h1 {
                font-size: 38px;
            }

            .details,
            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="interview-page">

    <header class="interview-header">

        <div class="interview-brand">
            Student2Career
        </div>

        <a href="faculty-dashboard.html"
           class="back-link">
            ← Faculty Dashboard
        </a>

    </header>


    <main class="interview-container">

        <div class="eyebrow">
            Faculty Portal
        </div>

        <h1>
            Interviews
        </h1>

        <p class="subtitle">
            Schedule and manage interviews for shortlisted students.
        </p>


        <div id="message"
             class="message">
        </div>


        <div id="interviewList">
        </div>

    </main>

</div>


<script>

const facultyData =
    localStorage.getItem("faculty");

if (!facultyData) {

    window.location.href =
        "index.html";

}

const faculty =
    JSON.parse(facultyData);


// =====================================================
// LOAD INTERVIEWS
// =====================================================

async function loadInterviews() {

    const container =
        document.getElementById(
            "interviewList"
        );

    try {

        const response =
            await fetch(
                `http://localhost:5000/api/interviews/faculty/${faculty.faculty_id}`
            );

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.message ||
                "Unable to load interviews."
            );

        }

        if (
            !data.interviews ||
            data.interviews.length === 0
        ) {

            container.innerHTML = `
                <div class="empty">

                    <h2>
                        No interviews scheduled yet
                    </h2>

                    <p>
                        Schedule interviews for shortlisted students
                        from this page.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML =
            data.interviews
            .map(interview =>
                createInterviewCard(
                    interview
                )
            )
            .join("");

    } catch (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );
    }
}


// =====================================================
// CREATE CARD
// =====================================================

function createInterviewCard(
    interview
) {

    const date =
        interview.interview_date
            ? new Date(
                interview.interview_date
              ).toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
              )
            : "-";

    const time =
        interview.interview_time ||
        "-";


    return `

        <div class="interview-card">

            <div class="card-top">

                <div>

                    <div class="student-name">
                        ${escapeHtml(
                            interview.student_name
                        )}
                    </div>

                    <div class="internship-name">
                        ${escapeHtml(
                            interview.internship_title
                        )}
                    </div>

                    <div class="company-name">
                        ${escapeHtml(
                            interview.company_name
                        )}
                    </div>

                </div>

                <div class="status">
                    ${escapeHtml(
                        interview.application_status
                    )}
                </div>

            </div>


            <div class="details">

                <div class="detail-box">

                    <div class="detail-label">
                        Interview Date
                    </div>

                    <div class="detail-value">
                        ${date}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Interview Time
                    </div>

                    <div class="detail-value">
                        ${time}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Interviewer
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            interview.interviewer_name
                        )}
                    </div>

                </div>

            </div>


            ${
                interview.result
                ?
                `
                <div class="detail-box"
                     style="margin-top:15px;">

                    <div class="detail-label">
                        Result
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            interview.result
                        )}
                    </div>

                </div>
                `
                :
                ""
            }


            ${
                interview.feedback
                ?
                `
                <div class="detail-box"
                     style="margin-top:15px;">

                    <div class="detail-label">
                        Feedback
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            interview.feedback
                        )}
                    </div>

                </div>
                `
                :
                ""
            }


            <div class="buttons">

                <button
                    class="secondary"
                    onclick="openEdit(
                        ${interview.interview_id},
                        '${interview.interview_date}',
                        '${interview.interview_time}',
                        '${escapeAttribute(interview.interviewer_name || "")}',
                        '${escapeAttribute(interview.result || "")}',
                        '${escapeAttribute(interview.feedback || "")}'
                    )">

                    Edit / Reschedule

                </button>


                <button
                    class="danger"
                    onclick="cancelInterview(
                        ${interview.interview_id}
                    )">

                    Cancel Interview

                </button>

            </div>


            <div
                id="edit-${interview.interview_id}"
                class="form-panel">

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Interview Date
                        </label>

                        <input
                            type="date"
                            id="date-${interview.interview_id}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Interview Time
                        </label>

                        <input
                            type="time"
                            id="time-${interview.interview_id}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Interviewer
                        </label>

                        <input
                            type="text"
                            id="interviewer-${interview.interview_id}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Result
                        </label>

                        <input
                            type="text"
                            id="result-${interview.interview_id}"
                            placeholder="e.g. Selected / Not Selected"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Feedback / Comments
                        </label>

                        <textarea
                            id="feedback-${interview.interview_id}"
                            placeholder="Enter interview feedback..."
                        ></textarea>

                    </div>

                </div>


                <div class="buttons">

                    <button
                        class="primary"
                        onclick="saveEdit(
                            ${interview.interview_id}
                        )">

                        Save Changes

                    </button>

                    <button
                        class="secondary"
                        onclick="closeEdit(
                            ${interview.interview_id}
                        )">

                        Cancel

                    </button>

                </div>

            </div>

        </div>

    `;
}


// =====================================================
// EDIT INTERVIEW
// =====================================================

function openEdit(
    id,
    date,
    time,
    interviewer,
    result,
    feedback
) {

    document.getElementById(
        `edit-${id}`
    ).classList.add("active");

    document.getElementById(
        `date-${id}`
    ).value = date || "";

    document.getElementById(
        `time-${id}`
    ).value = time
        ? time.substring(0, 5)
        : "";

    document.getElementById(
        `interviewer-${id}`
    ).value = interviewer || "";

    document.getElementById(
        `result-${id}`
    ).value = result || "";

    document.getElementById(
        `feedback-${id}`
    ).value = feedback || "";
}


function closeEdit(id) {

    document.getElementById(
        `edit-${id}`
    ).classList.remove("active");
}


// =====================================================
// SAVE EDIT
// =====================================================

async function saveEdit(id) {

    const date =
        document.getElementById(
            `date-${id}`
        ).value;

    const time =
        document.getElementById(
            `time-${id}`
        ).value;

    const interviewer =
        document.getElementById(
            `interviewer-${id}`
        ).value;

    const result =
        document.getElementById(
            `result-${id}`
        ).value;

    const feedback =
        document.getElementById(
            `feedback-${id}`
        ).value;


    try {

        const response =
            await fetch(
                `http://localhost:5000/api/interviews/${id}`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        faculty_id:
                            faculty.faculty_id,

                        interview_date:
                            date,

                        interview_time:
                            time,

                        interviewer_name:
                            interviewer,

                        result:
                            result,

                        feedback:
                            feedback
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to update interview."
            );

        }


        showMessage(
            "Interview updated successfully.",
            "success"
        );

        loadInterviews();

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}


// =====================================================
// CANCEL INTERVIEW
// =====================================================

async function cancelInterview(id) {

    const confirmCancel =
        confirm(
            "Are you sure you want to cancel this interview?"
        );

    if (!confirmCancel) {
        return;
    }


    try {

        const response =
            await fetch(
                `http://localhost:5000/api/interviews/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        faculty_id:
                            faculty.faculty_id

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to cancel interview."
            );

        }


        showMessage(
            "Interview cancelled successfully.",
            "success"
        );

        loadInterviews();

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        message;

    element.className =
        `message ${type}`;

    setTimeout(() => {

        element.className =
            "message";

    }, 4000);
}


// =====================================================
// SECURITY HELPERS
// =====================================================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");
}


// =====================================================
// START
// =====================================================

loadInterviews();

</script>

</body>

</html>
