<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Management | Student2Career</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background: #FFF7ED;
            color: #242124;
        }

        .page {
            max-width: 1250px;
            margin: auto;
            padding: 35px 25px 60px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        h1 {
            margin: 0;
            color: #7A1F3D;
            font-size: 32px;
        }

        .subtitle {
            color: #756F72;
            margin-top: 7px;
        }

        .back {
            text-decoration: none;
            background: #7A1F3D;
            color: white;
            padding: 11px 18px;
            border-radius: 9px;
            font-weight: 600;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border: 1px solid #E8E0DC;
            border-radius: 15px;
            padding: 22px;
        }

        .stat span {
            display: block;
            color: #756F72;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat strong {
            font-size: 28px;
            color: #7A1F3D;
        }

        .toolbar {
            background: white;
            border: 1px solid #E8E0DC;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }

        #search {
            flex: 1;
            padding: 13px 15px;
            border: 1px solid #D9CFCA;
            border-radius: 9px;
            font-size: 15px;
        }

        .refresh {
            border: none;
            background: #E76F51;
            color: white;
            padding: 0 22px;
            border-radius: 9px;
            font-weight: 600;
            cursor: pointer;
        }

        .table-box {
            background: white;
            border: 1px solid #E8E0DC;
            border-radius: 15px;
            overflow: hidden;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        th {
            background: #7A1F3D;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #EEE7E3;
            font-size: 14px;
        }

        tr:hover td {
            background: #FFF9F5;
        }

        .name {
            font-weight: 700;
            color: #7A1F3D;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        button.action {
            border: none;
            padding: 8px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .view {
            background: #F1E5E8;
            color: #7A1F3D;
        }

        .edit {
            background: #FBE5DC;
            color: #A4482F;
        }

        .delete {
            background: #F8DAD5;
            color: #9E3024;
        }

        .empty {
            text-align: center;
            padding: 45px;
            color: #756F72;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(36,33,36,.55);
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 580px;
            background: white;
            border-radius: 18px;
            padding: 28px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h2 {
            color: #7A1F3D;
            margin-top: 0;
        }

        .close {
            position: absolute;
            right: 18px;
            top: 12px;
            border: none;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail {
            background: #FFF7ED;
            padding: 14px;
            border-radius: 10px;
        }

        .detail small {
            display: block;
            color: #756F72;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #5B1730;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #D9CFCA;
            border-radius: 8px;
        }

        .save {
            width: 100%;
            border: none;
            background: #7A1F3D;
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #E5F1E8;
            color: #356143;
        }

        .error {
            background: #F9E0DC;
            color: #9E3024;
        }

        @media(max-width:700px) {

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
            }

            .refresh {
                padding: 12px;
            }

            .details {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <div class="top">

        <div>
            <h1>Faculty Management</h1>

            <div class="subtitle">
                Manage faculty members and their academic information.
            </div>
        </div>

        <a href="admin-dashboard.html" class="back">
            ← Admin Dashboard
        </a>

    </div>


    <div class="stats">

        <div class="stat">
            <span>Total Faculty</span>
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            <span>Departments</span>
            <strong id="departments">0</strong>
        </div>

    </div>


    <div class="toolbar">

        <input
            id="search"
            type="text"
            placeholder="Search faculty by name, email or department..."
        >

        <button class="refresh" onclick="loadFaculty()">
            ↻ Refresh
        </button>

    </div>


    <div id="message" class="message"></div>


    <div class="table-box">

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Registered</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="facultyTable">

                    <tr>
                        <td colspan="6" class="empty">
                            Loading faculty...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- VIEW MODAL -->

<div class="modal" id="viewModal">

    <div class="modal-box">

        <button class="close" onclick="closeModal('viewModal')">
            ×
        </button>

        <h2>Faculty Details</h2>

        <div id="details"></div>

    </div>

</div>


<!-- EDIT MODAL -->

<div class="modal" id="editModal">

    <div class="modal-box">

        <button class="close" onclick="closeModal('editModal')">
            ×
        </button>

        <h2>Edit Faculty</h2>

        <div id="editMessage" class="message"></div>

        <form id="editForm">

            <input type="hidden" id="facultyId">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Department</label>

                <input
                    type="text"
                    id="department"
                >

            </div>

            <button class="save" type="submit">
                Save Changes
            </button>

        </form>

    </div>

</div>


<script>

const API = "http://localhost:5000/api";

let facultyList = [];


// =====================================================
// LOAD FACULTY
// =====================================================

async function loadFaculty() {

    try {

        const response = await fetch(
            `${API}/faculty/admin/all`
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message || "Unable to load faculty."
            );

        }

        facultyList = data.faculty || [];

        updateStats();

        displayFaculty(facultyList);

    } catch(error) {

        console.error(error);

        document.getElementById("facultyTable").innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    Unable to load faculty.
                    <br><br>
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

    }

}


// =====================================================
// STATS
// =====================================================

function updateStats() {

    document.getElementById("total").textContent =
        facultyList.length;

    const departments = new Set(
        facultyList
            .map(f => f.department)
            .filter(Boolean)
    );

    document.getElementById("departments").textContent =
        departments.size;

}


// =====================================================
// DISPLAY
// =====================================================

function displayFaculty(list) {

    const table =
        document.getElementById("facultyTable");

    if (!list.length) {

        table.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No faculty members found.
                </td>
            </tr>
        `;

        return;
    }

    table.innerHTML = list.map(f => `

        <tr>

            <td>
                #${f.faculty_id}
            </td>

            <td class="name">
                ${escapeHtml(f.name)}
            </td>

            <td>
                ${escapeHtml(f.email)}
            </td>

            <td>
                ${escapeHtml(f.department || "Not provided")}
            </td>

            <td>
                ${
                    f.created_at
                    ? new Date(f.created_at)
                        .toLocaleDateString()
                    : "N/A"
                }
            </td>

            <td>

                <div class="actions">

                    <button
                        class="action view"
                        onclick="viewFaculty(${f.faculty_id})"
                    >
                        View
                    </button>

                    <button
                        class="action edit"
                        onclick="editFaculty(${f.faculty_id})"
                    >
                        Edit
                    </button>

                    <button
                        class="action delete"
                        onclick="deleteFaculty(${f.faculty_id})"
                    >
                        Delete
                    </button>

                </div>

            </td>

        </tr>

    `).join("");

}


// =====================================================
// SEARCH
// =====================================================

document
    .getElementById("search")
    .addEventListener("input", function() {

        const value =
            this.value.toLowerCase().trim();

        const filtered =
            facultyList.filter(f =>

                (f.name || "")
                    .toLowerCase()
                    .includes(value)

                ||

                (f.email || "")
                    .toLowerCase()
                    .includes(value)

                ||

                (f.department || "")
                    .toLowerCase()
                    .includes(value)

            );

        displayFaculty(filtered);

    });


// =====================================================
// VIEW
// =====================================================

async function viewFaculty(id) {

    try {

        const response = await fetch(
            `${API}/faculty/admin/${id}`
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to load faculty."
            );
        }

        const f = data.faculty;

        document.getElementById("details").innerHTML = `

            <div class="details">

                <div class="detail">
                    <small>Faculty ID</small>
                    <strong>#${f.faculty_id}</strong>
                </div>

                <div class="detail">
                    <small>Name</small>
                    <strong>${escapeHtml(f.name)}</strong>
                </div>

                <div class="detail">
                    <small>Email</small>
                    <strong>${escapeHtml(f.email)}</strong>
                </div>

                <div class="detail">
                    <small>Department</small>
                    <strong>
                        ${escapeHtml(f.department || "Not provided")}
                    </strong>
                </div>

                <div class="detail">
                    <small>User ID</small>
                    <strong>${f.user_id}</strong>
                </div>

                <div class="detail">
                    <small>Registered</small>
                    <strong>
                        ${
                            f.created_at
                            ? new Date(f.created_at)
                                .toLocaleDateString()
                            : "N/A"
                        }
                    </strong>
                </div>

            </div>
        `;

        openModal("viewModal");

    } catch(error) {

        showMessage(error.message, "error");

    }

}


// =====================================================
// EDIT
// =====================================================

async function editFaculty(id) {

    try {

        const response = await fetch(
            `${API}/faculty/admin/${id}`
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to load faculty."
            );
        }

        const f = data.faculty;

        document.getElementById("facultyId").value =
            f.faculty_id;

        document.getElementById("name").value =
            f.name || "";

        document.getElementById("email").value =
            f.email || "";

        document.getElementById("department").value =
            f.department || "";

        document.getElementById("editMessage").style.display =
            "none";

        openModal("editModal");

    } catch(error) {

        showMessage(error.message, "error");

    }

}


// =====================================================
// SAVE EDIT
// =====================================================

document
    .getElementById("editForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const id =
            document.getElementById("facultyId").value;

        const body = {

            name:
                document.getElementById("name")
                    .value.trim(),

            email:
                document.getElementById("email")
                    .value.trim(),

            department:
                document.getElementById("department")
                    .value.trim()

        };


        try {

            const response = await fetch(
                `${API}/faculty/admin/${id}`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(body)
                }
            );

            const data = await response.json();

            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Unable to update faculty."
                );

            }

            closeModal("editModal");

            showMessage(
                "Faculty updated successfully.",
                "success"
            );

            await loadFaculty();

        } catch(error) {

            const box =
                document.getElementById("editMessage");

            box.textContent =
                error.message;

            box.className =
                "message error";

            box.style.display =
                "block";

        }

    });


// =====================================================
// DELETE
// =====================================================

async function deleteFaculty(id) {

    const faculty =
        facultyList.find(
            f => Number(f.faculty_id) === Number(id)
        );

    const name =
        faculty ? faculty.name : "this faculty member";


    if (!confirm(
        `Are you sure you want to remove ${name}?\n\nThis action cannot be undone.`
    )) {

        return;

    }


    try {

        const response = await fetch(
            `${API}/faculty/admin/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Unable to remove faculty."
            );

        }

        showMessage(
            "Faculty removed successfully.",
            "success"
        );

        await loadFaculty();

    } catch(error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


// =====================================================
// MODAL
// =====================================================

function openModal(id) {

    document.getElementById(id).style.display =
        "flex";

}


function closeModal(id) {

    document.getElementById(id).style.display =
        "none";

}


window.addEventListener("click", function(e) {

    if (e.target.classList.contains("modal")) {

        e.target.style.display =
            "none";

    }

});


// =====================================================
// MESSAGE
// =====================================================

function showMessage(message, type) {

    const box =
        document.getElementById("message");

    box.textContent =
        message;

    box.className =
        `message ${type}`;

    box.style.display =
        "block";

    setTimeout(() => {

        box.style.display =
            "none";

    }, 3500);

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================================
// INITIAL LOAD
// =====================================================

loadFaculty();

</script>

</body>

</html>
