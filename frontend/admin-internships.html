<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internship Approvals | Student2Career</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            background: #f8f7f4;
            font-family: Arial, sans-serif;
        }

        .admin-container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top-section h1 {
            margin-bottom: 8px;
        }

        .top-section p {
            color: #666;
        }

        .back-btn {
            text-decoration: none;
            color: #222;
            font-weight: 600;
        }

        .request-card {
            background: white;
            border: 1px solid #e5e1d8;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .request-card h2 {
            margin: 10px 0 20px;
        }

        .status {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 20px 0;
        }

        .detail {
            background: #f7f5f0;
            padding: 13px;
            border-radius: 9px;
        }

        .description {
            line-height: 1.6;
            color: #444;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .action-btn {
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .approve-btn {
            background: #198754;
            color: white;
        }

        .reject-btn {
            background: #dc3545;
            color: white;
        }

        .approve-btn:hover,
        .reject-btn:hover {
            opacity: 0.9;
        }

        #message {
            margin-bottom: 20px;
            font-weight: 600;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            color: #666;
        }

        @media(max-width: 700px) {

            .top-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>

</head>


<body>


<div class="admin-container">


    <!-- HEADER -->

    <div class="top-section">

        <div>

            <h1>Internship Approval Requests</h1>

            <p>
                Review internships verified by faculty
                before making them available to students.
            </p>

        </div>


        <a href="admin-dashboard.html" class="back-btn">
            ← Admin Dashboard
        </a>

    </div>


    <div id="message"></div>


    <!-- REQUESTS -->

    <div id="requests">

        Loading internship requests...

    </div>


</div>



<script>


// ==========================================
// LOAD FACULTY VERIFIED INTERNSHIPS
// ==========================================

async function loadRequests() {

    const container =
        document.getElementById("requests");

    try {

        const response = await fetch(
            "http://localhost:5000/api/internships/admin/review"
        );

        const data = await response.json();


        if (!response.ok) {

            container.innerHTML =
                "<div class='empty'>Unable to load internship requests.</div>";

            return;
        }


        if (data.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h3>No Pending Internship Requests</h3>
                    <p>
                        There are currently no faculty-verified
                        internships waiting for approval.
                    </p>
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        data.forEach(item => {


            const card =
                document.createElement("div");

            card.className = "request-card";


            card.innerHTML = `

                <span class="status">
                    ✓ Faculty Verified
                </span>


                <h2>
                    ${item.title}
                </h2>


                <div class="details">


                    <div class="detail">

                        <strong>Company</strong><br>

                        ${item.company_name}

                    </div>


                    <div class="detail">

                        <strong>Faculty</strong><br>

                        ${item.faculty_name || "Not available"}

                    </div>


                    <div class="detail">

                        <strong>Domain</strong><br>

                        ${item.domain}

                    </div>


                    <div class="detail">

                        <strong>Duration</strong><br>

                        ${item.duration_weeks} weeks

                    </div>


                    <div class="detail">

                        <strong>Stipend</strong><br>

                        ₹${item.stipend}

                    </div>


                    <div class="detail">

                        <strong>Application Deadline</strong><br>

                        ${item.application_deadline}

                    </div>


                    <div class="detail">

                        <strong>Start Date</strong><br>

                        ${item.start_date}

                    </div>


                    <div class="detail">

                        <strong>End Date</strong><br>

                        ${item.end_date}

                    </div>


                </div>


                <div class="description">

                    <strong>Description:</strong>

                    <p>
                        ${item.description || "No description provided."}
                    </p>

                </div>


                <div class="buttons">


                    <button
                        class="action-btn approve-btn"
                        onclick="updateStatus(${item.internship_id}, 'approved')">

                        ✓ Approve Internship

                    </button>


                    <button
                        class="action-btn reject-btn"
                        onclick="updateStatus(${item.internship_id}, 'rejected')">

                        ✕ Reject Internship

                    </button>


                </div>

            `;


            container.appendChild(card);

        });


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Cannot connect to Student2Career server.
            </div>
        `;

    }

}



// ==========================================
// APPROVE / REJECT
// ==========================================

async function updateStatus(id, status) {


    const message =
        document.getElementById("message");


    try {


        const response = await fetch(

            `http://localhost:5000/api/internships/${id}/status`,

            {

                method: "PATCH",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: status
                })

            }

        );


        const data =
            await response.json();


        if (!response.ok) {

            message.style.color = "red";

            message.textContent =
                data.message ||
                "Unable to update internship.";

            return;
        }


        message.style.color = "green";


        if (status === "approved") {

            message.textContent =
                "✓ Internship approved successfully.";

        } else {

            message.textContent =
                "✓ Internship rejected successfully.";

        }


        loadRequests();


    } catch (error) {


        console.error(error);


        message.style.color = "red";

        message.textContent =
            "Cannot connect to Student2Career server.";

    }

}



// START

loadRequests();


</script>


</body>

</html>
